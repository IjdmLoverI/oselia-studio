services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oselia
      POSTGRES_PASSWORD: oselia
      POSTGRES_DB: oselia
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oselia -d oselia']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
